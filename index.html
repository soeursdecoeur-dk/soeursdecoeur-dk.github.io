<style>
:root{
  --book-w:min(900px,66vw,calc((100vh - 330px)*2.372));
  --night:#382f7f;
  --cream2:#ffdea6; --peach:#e89872; --navy:#001d59; --lav:#9f99d4;
  --chalk:"Chalkboard SE","Chalkboard","Delius","Comic Sans MS",sans-serif; --ink:#26215c; --cream:#fde1a6; --white:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);

}
:root:not([data-theme="light"]){color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--night) url("assets/42a3a16ee52a.jpg") center/cover fixed;
  font-family:"Chalkboard SE","Chalkboard","Delius","Comic Sans MS","Trebuchet MS",sans-serif;
  color:var(--white);
  display:flex;flex-direction:column;
}
.nav{
  display:flex;justify-content:flex-end;align-items:center;gap:clamp(10px,1.6vw,22px);
  padding:clamp(14px,4vh,48px) clamp(14px,3vw,40px) 0;
}
.nav button,.nav a{flex:none;font:inherit;background:none;border:0;padding:0;cursor:pointer;display:block;line-height:0;border-radius:10px}
.nav img{height:clamp(28px,3.6vw,44px);width:auto;display:block;transition:transform .15s}
.nav a:hover img,.nav button:hover img{transform:translateY(-2px)}
.home-box{--h:clamp(28px,3.6vw,44px);display:block;flex:none;width:var(--h);height:var(--h);min-width:var(--h);aspect-ratio:1/1;box-sizing:border-box;background:var(--cream2);
  border:calc(var(--h)*.075) solid var(--peach);border-radius:calc(var(--h)*.22);transition:transform .15s}
.home-box svg{width:100%;height:100%;display:block}
.nav a:hover .home-box{transform:translateY(-2px)}
.home-btn[aria-disabled="true"]:hover .home-box{transform:none}
.lang-switch{--h:clamp(28px,3.6vw,44px);display:flex;height:var(--h);width:calc(var(--h)*2.82);box-sizing:border-box;
  background:var(--cream2);border:calc(var(--h)*.055) solid var(--peach);border-radius:calc(var(--h)*.2);overflow:hidden;line-height:1}
.nav .lang-half{flex:1;-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;margin:0;border-radius:0;cursor:pointer;
  font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:800;font-size:calc(var(--h)*.7);letter-spacing:.01em;
  color:var(--lav);display:flex;align-items:center;justify-content:center;padding-top:calc(var(--h)*.06);transition:color .15s}
.nav .lang-half.en{border-right:calc(var(--h)*.055) solid var(--peach)}
.nav .lang-half[aria-pressed="true"]{color:var(--navy);cursor:default}
.nav .lang-half:not([aria-pressed="true"]):hover{color:#7f78c4}
.home-btn[aria-disabled="true"]{opacity:.55;cursor:default}
.home-btn[aria-disabled="true"]:hover img{transform:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vh,36px) clamp(10px,3vw,40px)}
.book{position:relative;width:var(--book-w);min-width:min(92vw,560px);aspect-ratio:2000/843}
.book img.page{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .35s ease;pointer-events:none;user-select:none}
.book img.page.on{opacity:1}
.hot{position:absolute;display:block;border-radius:8px;-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;margin:0;box-shadow:none;color:inherit;-webkit-tap-highlight-color:transparent}
.hot:focus-visible,.nav :focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.tab{left:94%;width:5%;height:15.5%}
.tab:hover{background:rgba(255,255,255,.18)}
.toc{left:54.5%;width:34.5%;height:7.6%;display:none}
.toc{cursor:pointer}
.toc:hover{background:rgba(253,225,166,.45);box-shadow:0 0 0 4px rgba(253,225,166,.45)}
.book[data-page="sommaire"] .toc{display:block}
.player{display:none;top:73.7%;height:8.4%;width:4.6%;border:0;padding:0;background:transparent;cursor:pointer}
.book[data-page="audio"] .player{display:block}
.player:hover{background:rgba(255,255,255,.22)}
.player:active{transform:translateY(1px)}
.player{border-radius:16%/18% !important}
.player.playing{box-shadow:0 0 0 2px #fff,0 0 10px 2px rgba(255,255,255,.8)}
footer{text-align:center;padding:0 16px clamp(16px,4vh,44px);font-size:max(13px,calc(var(--book-w) * .0195));letter-spacing:.03em;line-height:1.9}
footer p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.photo{display:none;border-radius:14px;cursor:zoom-in}
.book[data-page="galerie"] .photo[data-pg="1"],.book[data-page="galerie2"] .photo[data-pg="2"]{display:block}
.photo:hover{background:rgba(255,255,255,.14)}
.lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(22,17,64,.9);padding:max(env(safe-area-inset-top,0px),56px) 64px max(env(safe-area-inset-bottom,0px),56px)}
.lb.open{display:flex}
#lbImg{position:relative;z-index:1;max-width:calc(100vw - 150px);max-height:calc(100vh - 175px);width:auto;height:auto;object-fit:contain;border-radius:10px;border:5px solid var(--cream);box-shadow:0 10px 40px rgba(0,0,0,.45);background:var(--cream)}
.lb button{position:absolute;z-index:5;display:block;touch-action:manipulation;width:clamp(40px,4.2vw,54px);height:auto;cursor:pointer;
  -webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;line-height:0;border-radius:12px}
.lb button img{pointer-events:none;width:100%;height:auto;display:block;border:0;border-radius:0;box-shadow:none;background:none;max-height:none}
.lb button:hover img{transform:translateY(-2px)}
.lb button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.lb .x{top:calc(env(safe-area-inset-top,0px) + 10px);right:14px}
.lb .prev{left:12px;top:50%;transform:translateY(-50%)}
.lb .next{right:12px;top:50%;transform:translateY(-50%)}
.lb .count{position:absolute;pointer-events:none;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;text-align:center;font-size:14px;opacity:.85}
@supports (height:100dvh){#lbImg{max-height:calc(100dvh - 175px)}.lb{height:100dvh}}
@media (max-width:600px){
  .lb{padding:calc(env(safe-area-inset-top,0px) + 64px) 14px calc(env(safe-area-inset-bottom,0px) + 84px)}
  #lbImg{max-width:calc(100vw - 28px);max-height:calc(100vh - 210px)}
  @supports (height:100dvh){#lbImg{max-height:calc(100dvh - 210px)}}
  .lb .prev,.lb .next{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:none;width:46px}
  .lb .prev{left:calc(env(safe-area-inset-left,0px) + 22px)}
  .lb .next{right:calc(env(safe-area-inset-right,0px) + 22px)}
  .lb .x{top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 18px)}
  .lb .count{bottom:calc(env(safe-area-inset-bottom,0px) + 34px)}
  .lb-year{font-size:22px;margin-bottom:.45em}
}
/* ===== Spinning vinyl ===== */
.vinyl{position:absolute;left:62.808%;top:54.197%;width:22.308%;height:13.777%;display:none;pointer-events:none;z-index:2}
.v-over{position:absolute;display:none;pointer-events:none;z-index:3}
.v-over svg{width:100%;height:100%;display:block}
.book[data-page="audio"] .vinyl,.book[data-page="audio"] .v-over{display:block}
.vinyl .disc{position:absolute;left:0;top:50%;width:100%;aspect-ratio:1;transform:translateY(-50%) scaleY(0.2603)}
.vinyl svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.vinyl .v-spin{animation:vspin 1.8s linear infinite;animation-play-state:paused}
.vinyl.spinning .v-spin{animation-play-state:running}
@keyframes vspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.vinyl .v-spin{animation-duration:6s}}
/* ===== Gallery page edges ===== */
.edge{display:none;width:6.5%;cursor:pointer;border-radius:0 !important;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent)}
.edge.next-page{left:90.3%;width:3.1%;top:12%;height:57%;z-index:3}
.edge.prev-page{left:6.1%;width:3%;top:12%;height:77%;z-index:3}
.book[data-page="galerie"] .next-page,.book[data-page="galerie2"] .prev-page{display:block}
.edge.next-page:hover{background:linear-gradient(90deg,rgba(90,70,170,0),rgba(90,70,170,.16))}
.edge.prev-page:hover{background:linear-gradient(270deg,rgba(90,70,170,0),rgba(90,70,170,.16))}
/* ===== Music credit plaque ===== */
.abar .ab-i{position:absolute;right:calc(var(--h)*.09);top:calc(var(--h)*.05);width:calc(var(--h)*.145);height:calc(var(--h)*.145);min-width:12px;min-height:12px;
  border-radius:50%;background:#fff;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;display:grid;place-items:center;
  font:700 calc(var(--h)*.13)/1 "Baloo 2",system-ui,sans-serif;color:var(--navy)}
.abar .ab-i svg{width:78%;height:78%;display:block}
.abar .ab-i:hover{transform:scale(1.08)}
.abar .ab-i:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.plaque{position:absolute;right:0;bottom:calc(100% + 12px);width:min(calc(var(--h)*3.1),88vw);box-sizing:border-box;padding:calc(var(--h)*.15) calc(var(--h)*.17);
  background:#fff;border:calc(var(--h)*.03) solid var(--navy);border-radius:calc(var(--h)*.22);color:var(--navy);text-align:center;
  font-family:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:800;font-size:calc(var(--h)*.16);line-height:1.45;
  opacity:0;visibility:hidden;transform:none;transition:opacity 1.6s ease,visibility 0s 1.6s;cursor:pointer;z-index:3;box-shadow:0 6px 20px rgba(10,8,40,.25)}
.plaque.below{bottom:auto;top:calc(100% + 12px)}
.plaque.show{opacity:1;visibility:visible;transition:opacity .35s ease}
.plaque h3{margin:0 0 .45em;font-size:1.12em;font-weight:800}
.plaque p{margin:0 0 .5em}.plaque p:last-child{margin:0}
.abar .ab-main{padding-right:calc(var(--h)*.12)}
/* ===== Signature ===== */
.signature{position:absolute;left:37.7%;top:74.5%;width:10.5%;height:auto;display:none;pointer-events:auto;cursor:pointer;z-index:3;border-radius:6px}
.signature:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.book[data-page="sommaire"] .signature{display:block}
/* ===== E-book ===== */
.ebook{display:none;left:54.38%;top:35.58%;width:33.31%;height:49.82%;padding:0;box-sizing:border-box;overflow:visible}
.ebook .eb-page{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;filter:drop-shadow(0 0 1.2px rgba(70,40,25,.45)) drop-shadow(0 2px 1.5px rgba(70,40,25,.3)) drop-shadow(0 4px 9px rgba(70,40,25,.3))}
.eb-ctrl{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
.ebook:hover .eb-ctrl,.ebook:focus-within .eb-ctrl{opacity:1}
@media (hover:none){.eb-ctrl{opacity:1}}
.eb-ctrl button{position:absolute;pointer-events:auto;-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;cursor:pointer;line-height:0;width:8.4%;min-width:20px;border-radius:8px}
.eb-ctrl button img,.eb-ctrl button svg{width:100%;height:auto;display:block}
.eb-ctrl button:hover img,.eb-ctrl button:hover svg{transform:translateY(-1px)}
.eb-ctrl button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.eb-prev{left:.6%;top:50%;transform:translateY(-50%)}
.eb-next{right:.6%;top:50%;transform:translateY(-50%)}
.eb-full{right:2%;top:3%}
.eb-count{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:rgba(255,255,255,.85);color:var(--navy);border-radius:99px;padding:.15em .7em;
  font:700 clamp(10px,1vw,13px)/1.4 "Baloo 2",system-ui,sans-serif;pointer-events:none;white-space:nowrap}
.ebook-splash{position:absolute;left:69.231%;top:9.124%;width:25%;height:36.496%;display:none;pointer-events:none;z-index:2}
.book[data-page="livre"] .ebook,.book[data-page="livre"] .ebook-splash{display:block}
.lb.reading #lbImg{background:#fff}
.lb-fig{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;max-width:100%;max-height:100%}
.lb-year{color:#fff;font-family:var(--chalk);font-weight:700;font-style:italic;font-size:clamp(20px,2.3vw,30px);line-height:1;
  margin:0 0 .6em;letter-spacing:.02em;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.lb-year:empty{display:none}
.lb.reading .lb-year{display:none}
/* ===== Purring cat ===== */
.purr-cat{display:none;left:21.4%;top:53%;width:8.2%;height:14.8%;cursor:pointer;border-radius:45% !important;z-index:3}
.book[data-page="livre"] .purr-cat{display:block}
.purr-cat:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.typewriter{display:none;left:60.8%;top:58.5%;width:22.3%;height:29.5%;cursor:pointer;border-radius:14px !important;z-index:3}
.book[data-page="histoire"] .typewriter{display:block}
.typewriter:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
/* ===== Audio bar ===== */
.abar{position:fixed;left:0;top:0;width:calc(max(250px,calc(var(--book-w)*.42))*.84);transform:translateY(-8px);opacity:0;visibility:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  transition:opacity .3s,transform .3s,visibility 0s .3s;--h:calc(max(250px,calc(var(--book-w)*.42))/4.8);
  display:flex;align-items:center;gap:calc(var(--h)*.17);box-sizing:border-box;height:var(--h);padding:0 calc(var(--h)*.2) 0 calc(var(--h)*.17);
  background:var(--cream2);border:calc(var(--h)*.07) solid var(--peach);border-radius:calc(var(--h)*.24);z-index:6}
.abar.show{opacity:1;visibility:visible;transform:none;transition:opacity .3s,transform .3s}
.abar.dragging{cursor:grabbing;transition:none;box-shadow:0 8px 24px rgba(10,8,40,.35)}
.abar .ab-x{position:absolute;left:calc(var(--h)*-.16);top:calc(var(--h)*-.32);width:calc(var(--h)*.2);height:calc(var(--h)*.2);min-width:16px;min-height:16px;
  border-radius:50%;background:#fff;border:0;padding:0;cursor:pointer;display:grid;place-items:center;-webkit-appearance:none;appearance:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.abar .ab-x svg{width:46%;height:46%;display:block}
.abar .ab-x:hover{transform:scale(1.08)}
.abar .ab-x:focus-visible{outline:2px solid #fff;outline-offset:2px}
.abar .ab-btn{flex:none;width:calc(var(--h)*.54);height:calc(var(--h)*.54);-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;cursor:pointer;line-height:0;border-radius:6px}
.abar .ab-btn svg{width:100%;height:100%;display:block}
.abar .ab-btn .i-pause{display:none}.abar.playing .ab-btn .i-pause{display:block}.abar.playing .ab-btn .i-play{display:none}
.abar .ab-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--h)*.02);padding-top:calc(var(--h)*.2)}
.abar .ab-times{display:flex;justify-content:space-between;font-family:var(--chalk);color:#000;font-size:min(calc(var(--h)*.2),max(13px,calc(var(--h)*.17)));line-height:1.1}
.abar input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:calc(var(--h)*.26);margin:0;background:transparent;cursor:pointer;--p:0%}
.abar input[type=range]:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:6px}
.abar input[type=range]::-webkit-slider-runnable-track{height:calc(var(--h)*.1);border-radius:99px;background:var(--navy);box-shadow:0 0 0 1px #fff}
.abar input[type=range]::-moz-range-track{height:calc(var(--h)*.1);border-radius:99px;background:var(--navy);box-shadow:0 0 0 1px #fff}
.abar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:calc(var(--h)*.26);height:calc(var(--h)*.26);border-radius:50%;background:var(--navy);border:1.5px solid #fff;margin-top:calc(var(--h)*-.08)}
.abar input[type=range]::-moz-range-thumb{width:calc(var(--h)*.26);height:calc(var(--h)*.26);border-radius:50%;background:var(--navy);border:1.5px solid #fff}
body.has-bar .book{margin-top:calc(max(250px,calc(var(--book-w)*.42))/4.8 + 16px)}
.book{transition:margin-top .3s}
@media (max-width:820px){:root{--book-w:min(84vw,calc((100vh - 300px)*2.372))}}
/* Phones: let the book fill (almost) the whole width */
@media (max-width:600px){
  :root{--book-w:min(96vw,calc((100vh - 220px)*2.372))}

@media (prefers-reduced-motion:reduce){.book img.page,.nav img{transition:none}}
/* ===== Loading screen ===== */
#loader{position:fixed;inset:0;z-index:100;background:#382f7f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .5s ease,visibility 0s .5s}
html:not(.loading) #loader{opacity:0;visibility:hidden}
#loader .spin{width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,222,166,.25);border-top-color:#ffdea6;animation:ldspin .9s linear infinite}
#loader p{margin:0;color:#ffdea6;font:600 16px/1 "Chalkboard SE","Chalkboard","Delius","Comic Sans MS",sans-serif;letter-spacing:.04em}
@keyframes ldspin{to{transform:rotate(360deg)}}
html.loading .nav,html.loading main,html.loading footer{opacity:0}
.nav,main,footer{transition:opacity .45s ease}


/* Phones held sideways: bigger photos, arrows hugging the photo */
@media (max-height:500px) and (orientation:landscape){
  .lb{padding:calc(env(safe-area-inset-top,0px) + 6px) 60px calc(env(safe-area-inset-bottom,0px) + 6px)}

  .lb .prev{left:max(calc(env(safe-area-inset-left,0px) + 6px),calc(50% - var(--iw,600px) / 2 - 54px))}
  .lb .next{right:max(calc(env(safe-area-inset-right,0px) + 6px),calc(50% - var(--iw,600px) / 2 - 54px))}
  .lb .x{top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);width:38px}
  .lb .count{bottom:calc(env(safe-area-inset-bottom,0px) + 4px);font-size:12px}
}
/* ===== E-book download link (reading mode only) ===== */
.lb-dl{display:none}
.lb.reading .lb-dl{display:block;position:relative;z-index:5;margin-top:10px;padding:2px 6px;color:#fff;opacity:.85;font-weight:400;font-size:15px;line-height:1.3;text-decoration:underline;text-underline-offset:3px;touch-action:manipulation}
.lb.reading .lb-dl:hover{opacity:1}
.lb-dl:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:4px}
.lb.open ~ footer{visibility:hidden}
.lb.reading #lbImg{max-height:calc(100vh - 210px)}
@supports (height:100dvh){.lb.reading #lbImg{max-height:calc(100dvh - 210px)}}
@media (max-width:600px){
  .lb.reading #lbImg{max-height:calc(100vh - 245px)}
  @supports (height:100dvh){.lb.reading #lbImg{max-height:calc(100dvh - 245px)}}
}
@media (max-height:500px) and (orientation:landscape){
  .lb{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
  .lb .count{bottom:max(env(safe-area-inset-bottom,0px),4px)}
  #lbImg{max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 54px)}
  @supports (height:100dvh){#lbImg{max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 54px)}}
  .lb.reading #lbImg{max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 58px)}
  @supports (height:100dvh){.lb.reading #lbImg{max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 58px)}}
  .lb.reading .lb-dl{margin-top:4px;font-size:13px}
}
/* ===== Phones: nav, book and credits all on one screen ===== */
@media (max-width:600px) and (orientation:portrait){
  footer{font-size:11px;line-height:1.6}
}
@media (max-height:500px) and (orientation:landscape){
  :root{--book-w:min(94vw,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 96px)*2.372))}
  @supports (height:100dvh){:root{--book-w:min(94vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 96px)*2.372))}}
  .nav{padding-top:22px;padding-right:max(24px,calc(env(safe-area-inset-right,0px) + 12px))}
  main{padding-top:4px;padding-bottom:4px}
  footer{font-size:10.5px;line-height:1.35;padding-bottom:4px}
}
/* ===== "?" button and contact card ===== */
:root{--hb-s:clamp(26px,2vw,32px);--hb-r:max(20px,calc(env(safe-area-inset-right,0px) + 12px));--hb-b:max(20px,calc(env(safe-area-inset-bottom,0px) + 8px))}
@media (max-height:500px) and (orientation:landscape){
  :root{--hb-s:26px;--hb-r:max(12px,calc(env(safe-area-inset-right,0px) - 20px));--hb-b:max(8px,calc(env(safe-area-inset-bottom,0px) + 4px))}
}
.foot-text{position:relative}
.help-btn{position:absolute;z-index:40;right:calc(var(--hb-r) - 16px);top:calc(50% - var(--hb-s) / 2);width:var(--hb-s);height:var(--hb-s);
  border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;padding:2px 0 0;cursor:pointer;
  font:800 calc(var(--hb-s) * .58)/1 "Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .15s,background .15s}
.help-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
.help-btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.lb.open ~ .help-btn,html.loading .help-btn{visibility:hidden}
/* invisible layer behind the open card: a tap anywhere around it closes the card */
.help-bg{position:fixed;inset:0;z-index:59;display:none;background:transparent;-webkit-tap-highlight-color:transparent}
.help-bg.on{display:block}
/* the card opens just to the left of the button, bottom-aligned with it (both live inside the credits block) */
.help-card{position:absolute;z-index:60;right:calc(var(--hb-r) - 16px + var(--hb-s) + 8px);bottom:calc(50% - var(--hb-s) / 2);width:max-content;text-align:left;letter-spacing:normal;
  max-width:calc(100vw - var(--hb-r) - var(--hb-s) - 24px);transform:scale(.94);transform-origin:100% 100%;
  background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 10px 7px;box-shadow:0 6px 18px rgba(10,6,40,.4);
  color:var(--ink);font:600 13px/1.3 "Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  opacity:0;visibility:hidden;transition:opacity .45s ease,transform .45s ease,visibility 0s linear .45s}
.help-card.show{opacity:1;visibility:visible;transform:scale(1);transition:opacity .25s ease,transform .25s ease,visibility 0s}
.help-card p{margin:0}
.help-t{text-align:center;font-weight:800;margin-bottom:1px!important}
.help-l{margin-bottom:1px!important}
.help-e{display:flex;align-items:center;gap:3px;flex-wrap:nowrap}
.help-e a{color:#3f6f86;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.help-copy{flex:none;display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin:-6px -6px -6px 0;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.help-copy svg{width:14px;height:14px}
.help-copy:hover{background:#efedf9}
.help-copy:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.help-ok{text-align:center;font-size:.9em;color:#2e7d4f;height:0;overflow:hidden;transition:height .2s}
.help-ok.on{height:1.3em;margin-top:1px!important}
</style>
</head>

<script>
(function(){
  var book=document.getElementById('book');
  var pages=[].slice.call(book.querySelectorAll('img.page'));
  var home=document.getElementById('homeBtn');
  var langBtn=document.getElementById('langBtn');
  var keys=['sommaire','audio','livre','histoire','galerie'];
  var lang=null;
  lang='fr'; // the site always opens in French
  function show(){
    var k=(location.hash||'').slice(1);
    if(keys.indexOf(k)<0)k='sommaire';
    var prev=book.dataset.page; book.dataset.page=k;
    pages.forEach(function(p){var on=p.dataset.key===k&&(p.dataset.lang===lang||p.dataset.lang==='any');if(on&&!p.getAttribute('src')&&p.dataset.src)p.src=p.dataset.src;p.classList.toggle('on',on)});
    home.setAttribute('aria-disabled',k==='sommaire'?'true':'false');
    if(k==='sommaire'&&prev!==k&&window.__playSignature&&!document.documentElement.classList.contains('loading'))window.__playSignature();
    if(typeof placeDefault==='function'&&abar)placeDefault();
    book.querySelectorAll('.tab').forEach(function(t){
      if(t.getAttribute('href')==='#'+(k==='galerie2'?'galerie':k))t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');
    });
  }
  function setLang(l){
    lang=l;
    try{localStorage.setItem('lang',l)}catch(e){}
    document.documentElement.lang=l;
    langBtn.querySelectorAll('.lang-half').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===l?'true':'false')});
    home.setAttribute('aria-label',l==='fr'?'Retour au sommaire':'Back to contents');
    document.getElementById('credit').textContent=l==='fr'?'Site web par Alesia Kulagina':'Website by Alesia Kulagina';
    document.title=l==='fr'?'Sœurs de Cœur':'Sœurs de Cœur';
    book.querySelectorAll('.sr[data-fr]').forEach(function(s){s.textContent=s.dataset[l]});
    book.querySelectorAll('.edge').forEach(function(b){b.setAttribute('aria-label',b.dataset[l])});
    book.querySelectorAll('.toc').forEach(function(a){a.style.top=a.dataset[l]+'%'});
    var tl={fr:{audio:"Écouter le livre audio",livre:"Lire le livre électronique",histoire:"Comment c'est né",galerie:"Galerie de photos"},en:{audio:"Listen to the audiobook",livre:"Read the e-book version",histoire:"How it came to be",galerie:"Photo gallery"}};
    book.querySelectorAll('.toc').forEach(function(b){b.setAttribute('aria-label',tl[l][b.dataset.go])});
    if(typeof loadAudio==='function')loadAudio();
    if(typeof lbLabels==='function')lbLabels();
    if(typeof helpLabels==='function')helpLabels();
    show();
  }
  // ===== Audiobook: put each recording's link here =====
  var AUDIO_SRC={fr:'assets/58547a43b7dd.m4a', en:''};
  var audio=document.getElementById('audio');
  var playBtn=document.getElementById('playBtn');
  function labels(){
    var playing=!audio.paused;
    playBtn.classList.toggle('playing',playing);
    playBtn.setAttribute('aria-pressed',playing?'true':'false');
    playBtn.setAttribute('aria-label',playing?(lang==='fr'?'Pause':'Pause'):playBtn.dataset[lang]);
    ['rewBtn','fwdBtn'].forEach(function(id){var b=document.getElementById(id);b.setAttribute('aria-label',b.dataset[lang])});

/* Go fullscreen on the first tap when a phone or tablet is held sideways.
   Browsers only allow fullscreen after a tap, and iPhone Safari does not allow it for web pages. */
(function(){
  var de=document.documentElement, req=de.requestFullscreen||de.webkitRequestFullscreen;
  if(!req||!window.matchMedia)return;
  var mq=window.matchMedia('(orientation: landscape) and (pointer: coarse)');
  function go(){
    if(!mq.matches)return;
    document.removeEventListener('click',go,true);
    if(document.fullscreenElement||document.webkitFullscreenElement)return;
    try{var p=req.call(de,{navigationUI:'hide'});if(p&&p.catch)p.catch(function(){});}catch(e){}
  }
  document.addEventListener('click',go,true);
})();
</script>
<script>
/* "?" button: shows the contact card, which fades after 5 seconds. The copy icon copies the address. */
(function(){
  var btn=document.getElementById('helpBtn'), card=document.getElementById('helpCard'), copyB=document.getElementById('helpCopy'),
      ok=document.getElementById('helpOk'), bg=document.getElementById('helpBg'), mail=document.getElementById('helpMail'), timer=null, hovering=false;
  var T={fr:{btn:'Questions? Contactez-moi',l:'Contactez-moi:',copy:"Copier l'adresse courriel",ok:'Adresse copiée!',fail:'Copiez: '},
         en:{btn:'Questions? Contact me',l:'Contact me:',copy:'Copy email address',ok:'Address copied!',fail:'Copy: '}};
  function L(){return T[document.documentElement.lang==='en'?'en':'fr']}
  window.helpLabels=function(){var t=L();btn.setAttribute('aria-label',t.btn);document.getElementById('helpL').textContent=t.l;copyB.setAttribute('aria-label',t.copy)};
  helpLabels();
  function hide(){clearTimeout(timer);card.classList.remove('show');bg.classList.remove('on');ok.classList.remove('on');btn.setAttribute('aria-expanded','false')}
  function arm(){clearTimeout(timer);timer=setTimeout(function(){if(!hovering)hide();},5000)}
  function show(){helpLabels();card.classList.add('show');bg.classList.add('on');btn.setAttribute('aria-expanded','true');arm()}
  btn.addEventListener('click',function(e){e.stopPropagation();card.classList.contains('show')?hide():show()});
  // keep it open while a mouse is over it (not on touch screens, where "hover" never ends)
  if(window.matchMedia&&matchMedia('(hover:hover)').matches){
    card.addEventListener('mouseenter',function(){hovering=true;clearTimeout(timer)});
    card.addEventListener('mouseleave',function(){hovering=false;if(card.classList.contains('show'))arm()});
  }
  function done(msg){ok.textContent=msg;ok.classList.add('on');arm()}
  copyB.addEventListener('click',function(e){
    e.stopPropagation();var addr=mail.textContent.trim(),t=L();
    function fallback(){var ta=document.createElement('textarea');ta.value=addr;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,addr.length);var r=false;try{r=document.execCommand('copy')}catch(err){}
      document.body.removeChild(ta);done(r?t.ok:t.fail+addr)}
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(addr).then(function(){done(t.ok)},fallback)}else fallback();
  });
  card.addEventListener('click',function(e){e.stopPropagation()});
  bg.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();hide()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&card.classList.contains('show'))hide()});
})();
</script>
